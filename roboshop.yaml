- name: roboshop instance management
  hosts: local
  connections: local
  vars:
    instances: ["mongodb","mysql","redis","rabbitmq"]
    image_id: ami-0220d79f3f480ecf5

  tasks:
  - name: create aws instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{item}}"
      image_id: "{{image_id}}"
      security_groups:
      - "roboshop-{{item}}"
      - demo-sg
    loop: "{{instances}}"
    register: ec2-output
  
  - name: print output
    debug:
      msg: "{{ec2-output}}"

